<!DOCTYPE html>
<html lang="en">
<head>
<base target="_self">
<style id="hustl-merge">
/* Shared shell owns the logo and the main nav */
.hdr .brand .hlogo,.hdr .brand .bdiv{display:none!important}
aside#nav.nav,#scrim{display:none!important}
.hm-menu{display:none;place-items:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;flex:none}
.hm-menu svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
@media (max-width:820px){.hm-menu{display:grid}}

/* ===== 3R branding (Team Portal banner) ===== */
:root{--navy:#000;--gold:#26A4CB;--accent:#1A8FB3;--accent-d:#136f8c;--accent-soft:rgba(38,164,203,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#26A4CB;--accent-d:#7fd0ea;--accent-soft:rgba(38,164,203,.22)}}
:root[data-theme="dark"]{--accent:#26A4CB;--accent-d:#7fd0ea;--accent-soft:rgba(38,164,203,.22)}
.hdr{background:#000;border-bottom:4px solid #26A4CB}.hdr::before,.hdr::after{display:none}
.mk3r{background:#26A4CB;color:#000;border-radius:6px;padding:3px 9px;font:900 20px/1.1 var(--f);flex:none}
.b3r{color:#fff;font-weight:800;font-size:15px;line-height:1.1;white-space:nowrap}.b3r small{display:block;color:#b9c2cb;font-size:10.5px;font-weight:600;letter-spacing:.06em;margin-top:2px}
.bnm{color:#26A4CB}.btn-gold{color:#000}
.cloud{font-size:11.5px;font-weight:600;color:#b9c2cb;white-space:nowrap;border:1px solid #3a4148;border-radius:20px;padding:2px 9px}
.cloud.ok{color:#9be3b5;border-color:#2c6b45}.cloud.bad{color:#ffb3ad;border-color:#7a2f2a}
.stpush{border:2px solid var(--accent);border-radius:12px;padding:14px 16px;margin-top:12px;background:var(--accent-soft)}
.stpush h3{margin:0 0 6px;font-size:16px}.stpush table{width:100%;margin-top:8px}.stpush td{padding:4px 6px;border-bottom:1px solid var(--line-soft);font-size:13px}
@media (max-width:820px){.b3r{display:none}}
#menuBtn,.hm-menu{display:none!important}
.xnav{display:flex;gap:4px;margin-left:8px}.xnav a{color:#b9c2cb;font-weight:700;font-size:13px;padding:6px 10px;border-radius:7px;text-decoration:none;white-space:nowrap}.xnav a.on{color:#fff;background:rgba(38,164,203,.25)}.xnav a:hover{color:#fff}
@media (max-width:820px){.xnav a:not(.on){padding:6px 6px}}

/* Team Portal banner: same as the main 3R Team Portal */
.hdr{background:#000!important;border-bottom:4px solid #26A4CB}
.hdr-in{padding:14px 20px 12px}
.logo3r{height:40px;width:auto;display:block;flex:none}
.ptitle3r{border-left:1px solid #3a4148;padding-left:12px;line-height:1.1;font-size:19px;font-weight:800;color:#fff;white-space:nowrap}
.ptitle3r small{display:block;color:#b9c2cb;font-size:11px;font-weight:600;letter-spacing:.06em;margin-top:2px}
.mk3r{font:800 20px/1.1 var(--f)!important;padding:2px 8px!important}
@media (max-width:820px){.logo3r{height:32px}.ptitle3r{font-size:16px}.ptitle3r small{display:none}}

/* item photos */
.ithumb{width:34px;height:34px;object-fit:contain;border-radius:6px;background:#fff;border:1px solid var(--line);vertical-align:middle;margin-right:8px;flex:none;cursor:zoom-in}
.ithumb.ph{display:inline-grid;place-items:center;color:var(--ink-3);font-size:15px;background:var(--surface-2);cursor:pointer}
.dr-photo{display:flex;gap:12px;align-items:center;margin:4px 0 10px}
.dr-photo img{width:120px;height:120px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--line)}
.dr-photo .noph{width:120px;height:120px;border-radius:10px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--ink-3);font-size:12px;text-align:center}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;z-index:9999}.zoom img{max-width:92vw;max-height:88vh;background:#fff;border-radius:10px}

/* ===== 3R header (KPI-board style, brand kit v2) ===== */
.hdr{background:#000!important;color:#fff;position:relative;overflow:hidden;border-bottom:0!important}
.hdr::before{content:"";display:block!important;position:absolute;inset:0;background-image:linear-gradient(rgba(38,164,203,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(38,164,203,.13) 1px,transparent 1px);background-size:22px 22px;pointer-events:none}
.hdr::after{content:"";display:block!important;position:absolute;left:0;right:0;bottom:0;height:4px;background:#26A4CB}
.hdr-in{position:relative;padding:14px 20px 16px}
.brand3r{display:flex;align-items:center;gap:12px;min-width:0;flex:none}
.bmark img{height:54px;width:auto;display:block}
.bword{display:flex;flex-direction:column;gap:4px;min-width:0}
.bwm img{height:28px;width:auto;max-width:48vw;display:block}
.bnm3r{font-stretch:118%;font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#26A4CB;line-height:1.1;white-space:nowrap}
@media (max-width:560px){.bmark img{height:40px}.bwm img{height:17px;max-width:calc(100vw - 120px)}.bnm3r{font-size:11px}.brand3r{gap:8px}}
</style>




<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3R Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>

:root{
  --bg:#F3F5F6;--surface:#FFFFFF;--surface-2:#F8FAFA;--ink:#141414;--ink-2:#4D4D4D;--ink-3:#8A979D;
  --line:#DDE3E6;--line-soft:#ECF0F2;
  --accent:#1F6FEB;--accent-d:#1550B8;--accent-soft:rgba(31,111,235,.12);--gold:#F2B705;--navy:#0A1F44;
  --danger:#C8413A;--danger-soft:#F8E1DF;--warn:#E08A1E;--warn-ink:#9A5D0F;--warn-soft:#FBEBD5;
  --good:#2C9A5B;--good-soft:#DCEFE3;--good-ink:#1F6B40;
  --shadow:0 12px 32px rgba(20,20,20,.18);
  --f:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1113;--surface:#171B1E;--surface-2:#13171A;--ink:#EEF2F4;--ink-2:#A6B2B8;--ink-3:#6E7A80;
  --line:#2A3136;--line-soft:#20262A;--accent-d:#8DB6FF;--accent-soft:rgba(31,111,235,.22);--danger:#E5625A;--danger-soft:#3A1C1A;--warn-ink:#F0B35E;--warn-soft:#36290F;
  --good:#4CBB7C;--good-soft:#143223;--good-ink:#7FD6A3;--shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1113;--surface:#171B1E;--surface-2:#13171A;--ink:#EEF2F4;--ink-2:#A6B2B8;--ink-3:#6E7A80;
  --line:#2A3136;--line-soft:#20262A;--accent-d:#8DB6FF;--accent-soft:rgba(31,111,235,.22);--danger:#E5625A;--danger-soft:#3A1C1A;--warn-ink:#F0B35E;--warn-soft:#36290F;
  --good:#4CBB7C;--good-soft:#143223;--good-ink:#7FD6A3;--shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:14.5px/1.45 var(--f);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f);font-stretch:110%;margin:0}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:flex;flex-direction:column;height:100%}

/* ===== Hustl header (matches Pricebook) ===== */
.hdr{background:var(--navy);color:#fff;position:relative;overflow:hidden;flex:none}
.hdr::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(90,145,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(90,145,255,.14) 1px,transparent 1px);background-size:22px 22px;pointer-events:none}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--gold)}
.hdr-in{position:relative;display:flex;align-items:center;gap:14px;padding:12px 20px 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:none}
.hlogo{height:42px;width:auto;display:block;flex:none}
.bdiv{width:1.5px;height:28px;background:rgba(255,255,255,.28);flex:none}
.hmark{display:grid;place-items:center;width:44px;height:44px;border-radius:9px;background:var(--gold);color:var(--navy);font:900 26px/1 var(--f);font-stretch:125%;flex:none}
.bword{display:flex;flex-direction:column;gap:5px}
.hwm{font:900 28px/1 var(--f);font-stretch:125%;letter-spacing:-.02em;color:#fff}
.bnm{font-stretch:118%;font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.hbtn{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:7px 12px;font:700 13px var(--f);cursor:pointer;white-space:nowrap}
.hbtn:hover{border-color:#fff}
.sp{flex:1}
.menu-btn{display:none;width:38px;height:38px;place-items:center;border-radius:8px;color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.search{flex:1;max-width:440px;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1.5px solid rgba(255,255,255,.22);border-radius:8px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.75);margin-left:12px}
.search:focus-within{border-color:var(--gold);background:rgba(255,255,255,.11)}
.search input{flex:1;border:0;background:none;color:#fff;outline:none;min-width:0}
.search input::placeholder{color:rgba(255,255,255,.6)}
.kbd{font:700 11px/1 var(--f);border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:3px 5px;color:rgba(255,255,255,.75)}
.hicon{width:38px;height:38px;display:grid;place-items:center;border-radius:8px;color:#fff;position:relative}
.hicon:hover{background:rgba(255,255,255,.1)}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--navy)}
.avatar{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font:800 13px/1 var(--f);flex:none}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:800}
.btn-gold:hover{filter:brightness(1.06);border-color:var(--gold)}
.btn-ghost{background:var(--surface)}

/* ===== Shell ===== */
.shell{flex:1;min-height:0;display:flex}
.nav{width:236px;flex:none;display:flex;flex-direction:column;background:var(--surface-2);border-right:1px solid var(--line);transition:width .18s ease;overflow:hidden}
.nav.collapsed{width:62px}
.nav-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 10px}
.nav-group{margin-bottom:2px}
.nav-row{display:flex;align-items:center;border-radius:7px;position:relative}
.nav-row:hover{background:var(--line-soft)}
.nav-row.active{background:var(--accent-soft)}
.nav-row.active::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--accent)}
.nav-link{flex:1;display:flex;align-items:center;gap:11px;padding:8px 10px;min-width:0;text-align:left;border-radius:7px;color:var(--ink-2);font-weight:600}
.nav-link svg{color:var(--ink-3)}
.nav-row.active .nav-link{color:var(--ink);font-weight:800}
.nav-row.active .nav-link svg{color:var(--accent)}
.nav-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-badge{margin-left:auto;background:var(--gold);color:var(--navy);font:800 11.5px/1 var(--f);padding:3px 6px;border-radius:9px}
.nav-caret{width:30px;height:34px;display:grid;place-items:center;border-radius:7px;color:var(--ink-3)}
.nav-caret svg{transition:transform .15s ease;width:16px;height:16px}
.nav-group.open .nav-caret svg{transform:rotate(90deg)}
.nav-sub{display:none;padding:2px 0 6px 39px}
.nav-group.open .nav-sub{display:block}
.nav-sub button{display:block;width:100%;text-align:left;padding:5px 10px;border-radius:6px;font-size:13.5px;color:var(--ink-2);font-weight:500}
.nav-sub button:hover{background:var(--line-soft);color:var(--ink)}
.nav-sub button.on{color:var(--accent-d);font-weight:800}
.nav.collapsed .nav-label,.nav.collapsed .nav-caret,.nav.collapsed .nav-sub,.nav.collapsed .nav-badge,.nav.collapsed .collapse-text{display:none}
.nav.collapsed .nav-link{justify-content:center;padding:8px 0}
.nav-foot{flex:none;padding:8px 10px;border-top:1px solid var(--line)}
.nav-foot button{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:7px;color:var(--ink-2);font-weight:600}
.nav-foot button:hover{background:var(--line-soft)}
.nav.collapsed .nav-foot button{justify-content:center}
.nav.collapsed .collapse-ico{transform:rotate(180deg)}

.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.scroll{flex:1;overflow:auto}

/* ===== Record header ===== */
.rec-head{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 24px 0}
.crumbs{font-size:13px;color:var(--ink-3);margin-bottom:6px}
.crumbs a{color:var(--accent-d);text-decoration:none;font-weight:600}
.crumbs a:hover{text-decoration:underline}
.head-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px 24px}
.who h1{font-size:28px;font-weight:850;font-stretch:112%;letter-spacing:-.4px;line-height:1.1}
.who-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11.5px;font-weight:700;border-radius:4px;padding:2px 7px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.tag.member{border-color:var(--gold);background:rgba(242,183,5,.14);color:var(--ink)}
.stats{display:flex;gap:1px;margin-left:auto;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stat{background:var(--surface);padding:8px 16px;min-width:120px}
.stat dt{font-size:12.5px;color:var(--ink-2)}
.stat dd{margin:2px 0 0;font:900 22px/1.1 var(--f);font-stretch:120%;letter-spacing:-.01em}
.stat dd.due{color:var(--danger)}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;width:100%;padding:12px 0 0}

/* ===== Record tabs ===== */
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:7px;padding:10px 14px 12px;font-weight:700;font-size:14.5px;font-stretch:108%;color:var(--ink-2);white-space:nowrap;border-radius:7px 7px 0 0}
.tab:hover{color:var(--ink);background:var(--line-soft)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:850}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.count{font:700 12px/1 var(--f);font-variant-numeric:tabular-nums;padding:3px 6px;border-radius:9px;background:var(--line-soft);color:var(--ink-2)}
.tab[aria-selected="true"] .count{background:var(--accent-soft);color:var(--accent-d)}
.count.alert,.tab[aria-selected="true"] .count.alert{background:var(--danger);color:#fff}

/* ===== Body ===== */
.rec-body{display:grid;grid-template-columns:auto 1fr auto;gap:16px;padding:16px 24px 32px;align-items:start}
.side{width:264px;background:var(--surface);border:1px solid var(--line);border-radius:10px;transition:width .18s ease;overflow:hidden}
.side.collapsed{width:42px}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.side-head h2{font-size:15px;font-weight:800}
.side.collapsed .side-head{padding:10px 4px;justify-content:center;border-bottom:0}
.side.collapsed .side-head h2,.side.collapsed .side-content{display:none}
.side.collapsed .side-toggle svg{transform:rotate(180deg)}
.side.right .side-toggle svg{transform:rotate(180deg)}
.side.right.collapsed .side-toggle svg{transform:none}
.side-toggle{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--ink-3)}
.side-toggle:hover{background:var(--line-soft);color:var(--ink)}
.side-content{padding:12px 14px 14px}
.kv{margin:0 0 12px}
.kv dt{font-size:12.5px;color:var(--ink-3)}
.kv dd{margin:1px 0 0;font-weight:600}
.loc{position:relative;border:1px solid var(--line);border-radius:8px;padding:9px 10px 9px 12px;margin-bottom:8px;width:100%;text-align:left;display:block}
.loc:hover{background:var(--line-soft)}
.loc.on{background:var(--accent-soft);border-color:transparent}
.loc.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--accent)}
.loc strong{display:block;font-weight:800}
.loc span{font-size:13px;color:var(--ink-2)}
.subhead{font-size:13px;font-weight:800;color:var(--ink-2);margin:14px 0 8px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.feed li:last-child{border-bottom:0}
.feed .when{display:block;font-size:12px;color:var(--ink-3)}
.feed svg.i{width:16px;height:16px;color:var(--accent);margin-top:2px}
.note-box{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2);color:var(--ink);margin-bottom:8px}

.center{min-width:0}
.block{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.block-head{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 8px}
.block-toggle{display:flex;align-items:center;gap:8px;flex:1;text-align:left;padding:4px 6px;border-radius:7px;min-width:0}
.block-toggle:hover{background:var(--line-soft)}
.block-toggle svg{transition:transform .15s ease;color:var(--ink-3)}
.block.open .block-toggle svg{transform:rotate(90deg)}
.block-toggle h3{font-size:16px;font-weight:800}
.block-body{display:none;border-top:1px solid var(--line);overflow-x:auto}
.block.open .block-body{display:block}
.link-btn{font-size:13.5px;font-weight:700;color:var(--accent-d);padding:5px 9px;border-radius:7px;white-space:nowrap}
.link-btn:hover{background:var(--accent-soft)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:700;text-align:left;color:var(--ink-2);font-size:12.5px;padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num{font-weight:700}
td a{color:var(--accent-d);font-weight:700;text-decoration:none}
td a:hover{text-decoration:underline}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:4px;border:1px solid transparent}
.p-ok{background:var(--good-soft);color:var(--good-ink)}
.p-warn{background:var(--warn-soft);color:var(--warn-ink)}
.p-bad{background:var(--danger-soft);color:var(--danger)}
.p-info{border-color:var(--accent);color:var(--accent-d)}
.p-mute{border-color:var(--line);color:var(--ink-2)}
.panel-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.panel-bar h2{margin:0 auto 0 0;font-size:22px;font-weight:850;font-stretch:112%;letter-spacing:-.3px}
.filter{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;padding:0 10px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.empty p{margin:0 0 10px}
.scrim{display:none}

@media (max-width:1180px){
  .rec-body{grid-template-columns:1fr}
  .side,.side.collapsed{width:auto}
  .side.left{order:2}.center{order:1}.side.right{order:3}
  .side.collapsed .side-head{justify-content:space-between;padding:10px 10px 10px 14px;border-bottom:1px solid var(--line)}
  .side.collapsed .side-head h2{display:block}
  .side-toggle svg{transform:rotate(-90deg)!important}
  .side.collapsed .side-toggle svg{transform:rotate(90deg)!important}
}
@media (max-width:980px){.search,.hide-md{display:none}}
@media (max-width:820px){
  .nav{position:fixed;z-index:40;top:0;bottom:0;left:0;padding-top:env(safe-area-inset-top,0px);transform:translateX(-100%);transition:transform .2s ease;width:260px!important;box-shadow:var(--shadow)}
  .nav.collapsed .nav-label,.nav.collapsed .nav-caret,.nav.collapsed .nav-badge{display:revert}
  .nav.collapsed .nav-link{justify-content:flex-start;padding:8px 10px}
  .nav.mobile-open{transform:none}
  .nav-foot{display:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
  .menu-btn{display:grid}
  .rec-head{padding:12px 16px 0}
  .rec-body{padding:12px 16px 24px}
  .stats{margin-left:0;width:100%}
  .stat{flex:1;min-width:0}
}
@media (max-width:560px){.hdr-in{gap:8px;padding:10px 14px 12px}.hmark{width:38px;height:38px;font-size:22px}.hwm{font-size:23px}.bnm,.bdiv,.hbtn,.btn-gold span{display:none}.hlogo{height:34px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Hustl purple theme: purple + white (light), purple + black (dark) ===== */
:root{
  --bg:#F7F6FA;--surface:#FFFFFF;--surface-2:#FAF9FC;--ink:#17141F;--ink-2:#4F4A5C;--ink-3:#8D879B;
  --line:#E4E1EC;--line-soft:#F1EFF6;
  --accent:#4A2391;--accent-d:#3B1A6E;--accent-soft:rgba(74,35,145,.09);
  --hdr-bg:#FFFFFF;--hdr-field:#F7F6FA;--stripe:#3B1A6E;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09080C;--surface:#131118;--surface-2:#0F0E13;--ink:#F1EEF7;--ink-2:#B3ACC2;--ink-3:#7A7389;
  --line:#2A2633;--line-soft:#1C1924;
  --accent:#7C55E0;--accent-d:#B49CF2;--accent-soft:rgba(124,85,224,.2);
  --hdr-bg:#000000;--hdr-field:#131118;--stripe:#7C55E0;}}
:root[data-theme="dark"]{
  --bg:#09080C;--surface:#131118;--surface-2:#0F0E13;--ink:#F1EEF7;--ink-2:#B3ACC2;--ink-3:#7A7389;
  --line:#2A2633;--line-soft:#1C1924;
  --accent:#7C55E0;--accent-d:#B49CF2;--accent-soft:rgba(124,85,224,.2);
  --hdr-bg:#000000;--hdr-field:#131118;--stripe:#7C55E0;}
body::before{background:var(--hdr-bg)}
.hdr{background:var(--hdr-bg);color:var(--ink)}
.hdr::before{display:none}
.hdr::after{height:3px;background:var(--stripe)}
.logo-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:block}
:root[data-theme="light"] .logo-d{display:none}:root[data-theme="light"] .logo-l{display:block}
.bnm{color:var(--accent-d)}
.bdiv{background:var(--line)}
.hbtn{border-color:var(--line);color:var(--ink)}
.hbtn:hover{border-color:var(--accent)}
.menu-btn{color:var(--ink);border-color:var(--line)}
.search{border-color:var(--line);background:var(--hdr-field);color:var(--ink-3)}
.search:focus-within{border-color:var(--accent);background:var(--surface)}
.search input{color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.kbd{border-color:var(--line);color:var(--ink-3)}
.hicon{color:var(--ink-2)}
.hicon:hover{background:var(--line-soft)}
.dot{border-color:var(--hdr-bg)}
.btn-gold,.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}
.btn-gold:hover,.btn-primary:hover{background:var(--accent);border-color:var(--accent);filter:brightness(1.12)}
.nav-badge{background:var(--accent);color:#fff}
.tag.member{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-d)}
.avatar{background:var(--accent);color:#fff}
.acct{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border-radius:10px;text-align:left;flex:none}
.acct:hover{background:var(--line-soft)}
.acct-txt{display:flex;flex-direction:column;line-height:1.2}
.acct-txt b{font-size:13.5px;font-weight:800;color:var(--ink)}
.acct-txt span{font-size:12px;font-weight:600;color:var(--accent-d);white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis}
.hlogo{height:40px}
@media (max-width:560px){.hlogo{height:32px}.acct-txt{display:none}.acct{padding:0}}

/* ===== Easier on the eyes: softer contrast, calmer weights, more breathing room ===== */
:root{
  --bg:#F6F5F9;--surface:#FDFDFE;--surface-2:#F9F8FB;--ink:#2B2735;--ink-2:#5E596B;--ink-3:#948FA0;
  --line:#E8E5EF;--line-soft:#F2F0F6;
  --accent:#5B3BA3;--accent-d:#4A2F86;--accent-soft:rgba(91,59,163,.08);
  --hdr-bg:#FDFDFE;--hdr-field:#F6F5F9;--stripe:#6E52B5;
  --good:#3E8E66;--good-soft:#E6F2EB;--good-ink:#2F6E4E;
  --warn-ink:#8C6420;--warn-soft:#F8F0DF;
  --danger:#BB5650;--danger-soft:#F8E8E6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141218;--surface:#1B1921;--surface-2:#18161D;--ink:#E2DEEA;--ink-2:#ABA5B8;--ink-3:#7D778A;
  --line:#2C2935;--line-soft:#221F29;
  --accent:#7A5CC9;--accent-d:#B7A3E6;--accent-soft:rgba(122,92,201,.16);
  --hdr-bg:#18161D;--hdr-field:#1F1C26;--stripe:#6B50B8;
  --good:#6BB892;--good-soft:#1C2E25;--good-ink:#8FCBAB;
  --warn-ink:#D9B26E;--warn-soft:#2E2718;
  --danger:#D98680;--danger-soft:#33201F;}}
:root[data-theme="dark"]{
  --bg:#141218;--surface:#1B1921;--surface-2:#18161D;--ink:#E2DEEA;--ink-2:#ABA5B8;--ink-3:#7D778A;
  --line:#2C2935;--line-soft:#221F29;
  --accent:#7A5CC9;--accent-d:#B7A3E6;--accent-soft:rgba(122,92,201,.16);
  --hdr-bg:#18161D;--hdr-field:#1F1C26;--stripe:#6B50B8;
  --good:#6BB892;--good-soft:#1C2E25;--good-ink:#8FCBAB;
  --warn-ink:#D9B26E;--warn-soft:#2E2718;
  --danger:#D98680;--danger-soft:#33201F;}
body{font-size:15px;line-height:1.55}
.hdr::after{height:2px}
.who h1{font-weight:720;font-stretch:105%;letter-spacing:-.2px}
.panel-bar h2{font-weight:700;font-stretch:104%;letter-spacing:-.15px}
.block-toggle h3,.side-head h2{font-weight:680}
.tab{font-weight:560;font-stretch:100%}
.tab[aria-selected="true"]{font-weight:700}
.tab[aria-selected="true"]::after{height:2px}
.nav-link{font-weight:520}
.nav-row.active .nav-link{font-weight:700}
.nav-sub button.on{font-weight:700}
.btn{font-weight:620}
.btn-gold,.btn-primary{font-weight:650}
.stat dd{font-weight:760;font-stretch:108%}
.stat dd.due{color:var(--danger)}
.acct-txt b{font-weight:700}
.kv dd,.loc strong{font-weight:600}
th{font-weight:620;letter-spacing:.01em}
td{padding:12px 14px}
td.num,td a{font-weight:620}
.pill,.tag{font-weight:600}
.count{font-weight:600}
.count.alert,.tab[aria-selected="true"] .count.alert{background:var(--danger-soft);color:var(--danger)}
.rec-body{gap:20px}
.block{margin-bottom:18px;border-color:var(--line)}
.side,.block{box-shadow:0 1px 2px rgba(30,20,60,.03)}

/* ===== Purple and mint ===== */
:root{
  --bg:#F5F7F7;--surface-2:#F9FAFA;--line:#E3E7E8;--line-soft:#EFF3F3;
  --accent:#5B3BA3;--accent-d:#4A2F86;--stripe:#5B3BA3;--hdr-field:#F5F7F7;
  --mint:#3FB68B;--good:#2E9E78;--good-soft:#E0F4EC;--good-ink:#1F7558;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131418;--surface:#1A1C21;--surface-2:#17191D;--line:#2A2D33;--line-soft:#202227;
  --hdr-bg:#17191D;--hdr-field:#1E2026;
  --mint:#4CC79A;--good:#5FCFA4;--good-soft:#163328;--good-ink:#8EE0BF;}}
:root[data-theme="dark"]{
  --bg:#131418;--surface:#1A1C21;--surface-2:#17191D;--line:#2A2D33;--line-soft:#202227;
  --hdr-bg:#17191D;--hdr-field:#1E2026;
  --mint:#4CC79A;--good:#5FCFA4;--good-soft:#163328;--good-ink:#8EE0BF;}
.p-ok{background:var(--good-soft);color:var(--good-ink)}
#statLife{color:var(--good-ink)}
.head-actions .btn:nth-child(3){border-color:var(--mint);color:var(--good-ink)}
.head-actions .btn:nth-child(3):hover{background:var(--good-soft)}
.feed svg.i{color:var(--mint)}
.empty .btn{border-color:var(--line)}

/* ===== Bad stuff is clearly red ===== */
:root{--danger:#D63B3B;--danger-soft:#FDE4E4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--danger:#F06464;--danger-soft:#3E1C1E}}
:root[data-theme="dark"]{--danger:#F06464;--danger-soft:#3E1C1E}
.p-bad{background:var(--danger);color:#fff}
.count.alert,.tab[aria-selected="true"] .count.alert,.block[data-block="invoices"] .count{background:var(--danger);color:#fff}
.stat:has(.due){background:var(--danger-soft)}
.stat:has(.due) dt{color:var(--danger);font-weight:600}
.stat dd.due{color:var(--danger);font-weight:800}
tr:has(.p-bad) td{background:color-mix(in srgb,var(--danger-soft) 55%,transparent)}
tr:has(.p-bad) td:first-child{box-shadow:inset 3px 0 0 var(--danger)}
tr:has(.p-bad) td:last-child{color:var(--danger);font-weight:800}
.dot{background:var(--danger)}

/* ===== Blue scheme ===== */
:root{
  --bg:#F4F6F9;--surface-2:#F8FAFC;--line:#E1E6EE;--line-soft:#EEF2F7;--hdr-field:#F4F6F9;
  --ink:#232A36;--ink-2:#566173;--ink-3:#8C95A5;
  --accent:#2563C9;--accent-d:#1D4E9E;--accent-soft:rgba(37,99,201,.09);--stripe:#2563C9;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151B;--surface:#181D25;--surface-2:#151A21;--line:#28303C;--line-soft:#1E242D;
  --ink:#E3E8F0;--ink-2:#A6B0C0;--ink-3:#77818F;
  --hdr-bg:#151A21;--hdr-field:#1C222B;
  --accent:#4C84E6;--accent-d:#A9C4F2;--accent-soft:rgba(76,132,230,.18);--stripe:#4C84E6;}}
:root[data-theme="dark"]{
  --bg:#11151B;--surface:#181D25;--surface-2:#151A21;--line:#28303C;--line-soft:#1E242D;
  --ink:#E3E8F0;--ink-2:#A6B0C0;--ink-3:#77818F;
  --hdr-bg:#151A21;--hdr-field:#1C222B;
  --accent:#4C84E6;--accent-d:#A9C4F2;--accent-soft:rgba(76,132,230,.18);--stripe:#4C84E6;}
.side,.block{box-shadow:0 1px 2px rgba(20,40,80,.04)}

/* ===== Black tabs ===== */
.tab{color:var(--ink-2)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{background:var(--ink);height:3px}
.tab[aria-selected="true"] .count{background:var(--ink);color:var(--surface)}
.tab[aria-selected="true"] .count.alert{background:var(--danger);color:#fff}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ===== Calls and booking ===== */
.page{padding:16px 24px 32px}
.muted{color:var(--ink-3)}
.good-n{color:var(--good-ink)}
.btn-sm{height:30px;padding:0 11px;font-size:13px}
.btn-block{width:100%;justify-content:center;height:44px;font-size:15px}
.btn-answer{background:var(--good);border-color:var(--good);color:#fff}
.btn-answer:hover{filter:brightness(1.08);border-color:var(--good)}
.btn-end{border-color:var(--danger);color:var(--danger);background:var(--surface)}
.btn-end:hover{background:var(--danger-soft);border-color:var(--danger)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px;gap:2px;flex-wrap:wrap}
.seg button{height:30px;padding:0 12px;border-radius:6px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button:hover{color:var(--ink);background:var(--line-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button.em[aria-pressed="true"]{background:var(--danger);color:#fff}

/* call log */
.caller{display:flex;align-items:center;gap:10px}
.caller b{display:block;font-weight:650}
.caller span span{font-size:12.5px;color:var(--ink-3)}
.dir{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line-soft);color:var(--ink-2);flex:none}
.dir svg.i{width:15px;height:15px}
.dir.miss{background:var(--danger-soft);color:var(--danger)}
.agent{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-d);font-size:12px;font-weight:700}
.why{color:var(--ink-2);font-size:13px;margin-left:6px}
.joblink{margin-left:6px}
td.act{text-align:right;width:1%}
.icon-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:inline-grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-d)}
.icon-btn svg.i{width:14px;height:14px}

/* incoming call */
.ring{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:10px;padding:14px 16px;margin-bottom:18px;box-shadow:0 1px 2px rgba(20,40,80,.04)}
.ring.live{border-left-color:var(--accent)}
.ring-ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--good-soft);color:var(--good-ink);position:relative;flex:none}
.ring-ico::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--good);animation:ringPulse 1.6s ease-out infinite}
.ring.live .ring-ico{background:var(--accent-soft);color:var(--accent-d)}
.ring.live .ring-ico::after{display:none}
@keyframes ringPulse{from{opacity:.7;transform:scale(.9)}to{opacity:0;transform:scale(1.35)}}
.ring-who{display:flex;flex-direction:column;min-width:180px}
.ring-lab{font-size:12.5px;color:var(--good-ink);font-weight:650}
.ring.live .ring-lab{color:var(--accent-d)}
.ring-who b{font-size:18px;font-weight:700}
.ring-who>span:last-child{color:var(--ink-2);font-size:13.5px}
.ring-flags{display:flex;gap:6px;flex-wrap:wrap}
.ring-act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* booking requests */
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.req{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.req-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.req-top b{font-size:16px;font-weight:700}
.req-top span{font-size:13px}
.req-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--ink-2);align-items:center}
.req p{margin:0}
.req-act{display:flex;gap:8px;margin-top:4px}

/* booking */
.bk-head{padding-bottom:14px}
.oncall{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;background:var(--good-soft);color:var(--good-ink);border-radius:9px;padding:6px 6px 6px 14px;margin-left:auto;font-size:14px}
.oncall b{font-weight:700}
#callTimer{font-variant-numeric:tabular-nums}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--good);animation:liveDot 1.6s infinite;flex:none}
@keyframes liveDot{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.bk{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:16px 24px 32px;align-items:start}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,40,80,.04);scroll-margin-top:12px}
.step-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.step-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;background:var(--line-soft);color:var(--ink-2);flex:none}
.step-n svg.i{width:14px;height:14px;stroke-width:2.6}
.step.done .step-n{background:var(--good);color:#fff}
.step-head h3{font-size:16px;font-weight:680}
.step-head .hint{margin-left:auto;font-size:13.5px;color:var(--ink-2);font-weight:600}
.step-body{padding:14px 16px 16px}
.step.need{animation:needIt 1.2s ease}
@keyframes needIt{0%,55%{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);font-weight:600}
.fld.full{grid-column:1/-1}
.inp{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:0 11px;font-size:14.5px;font-weight:500}
textarea.inp{height:auto;min-height:78px;padding:9px 11px;resize:vertical;line-height:1.45}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-in{position:relative;display:block}
.search-in svg.i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search-in .inp{padding-left:36px}
.results{border:1px solid var(--line);border-radius:9px;margin-top:8px;overflow:hidden}
.res{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
.res:last-child{border-bottom:0}
.res:hover,.res:focus-visible{background:var(--accent-soft)}
.res b{font-weight:650}
.res .sub{display:block;font-size:13px;color:var(--ink-3)}
.res .tag{margin-left:auto}
.res-new{color:var(--accent-d);font-weight:650}
.sublabel{font-size:13px;font-weight:650;color:var(--ink-2);margin:16px 0 8px}
.sublabel:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--ink-2)}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.cust{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start}
.cust h4{margin:0;font-size:19px;font-weight:700;font-stretch:105%}
.cust-contact{margin-top:8px;color:var(--ink-2);font-size:14px}
.flag{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:8px 10px;border-radius:8px;margin:0 0 6px}
.flag.bad{background:var(--danger-soft);color:var(--danger);font-weight:600}
.flag.good{background:var(--good-soft);color:var(--good-ink)}
.flag.warn{background:var(--warn-soft);color:var(--warn-ink)}
.step-body>.flag{margin-top:10px}
.locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:4px}
.locs .loc{margin:0}
.loc.add{display:flex;align-items:center;gap:8px;border-style:dashed;color:var(--ink-2)}
.locs+.fgrid{margin-top:12px}
.check{display:flex;align-items:center;gap:10px;font-weight:500;font-size:14.5px;color:var(--ink)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.sms{margin-top:10px;max-width:440px;background:var(--line-soft);border-radius:14px 14px 14px 4px;padding:10px 13px;font-size:14px}
.aside{margin:10px 0 0}

/* arrival windows: the capacity grid */
.slots-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.legend{font-size:12.5px;color:var(--ink-3)}
.slots-wrap{overflow-x:auto}
.slots{display:grid;grid-template-columns:96px repeat(5,minmax(92px,1fr));gap:6px;min-width:600px}
.sh{font-size:12.5px;color:var(--ink-3);font-weight:600;padding:0 4px 2px}
.sh b{display:block;color:var(--ink);font-size:14px;font-weight:700}
.wl{font-size:13px;font-weight:650;color:var(--ink-2);display:flex;align-items:center}
.slot{height:54px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--good-ink)}
.slot:not(:disabled):hover{border-color:var(--accent)}
.slot.few{color:var(--warn-ink);background:var(--warn-soft);border-color:transparent}
.slot.full,.slot.past{background:var(--surface-2);color:var(--ink-3);cursor:not-allowed;border-style:dashed}
.slot[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pips{display:flex;gap:3px}
.pips b{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.22}
.pips b.on{opacity:1}
.slot.asap{width:100%;height:46px;flex-direction:row;gap:8px;color:var(--danger);border-color:var(--danger);background:var(--danger-soft);font-size:14px;margin-bottom:12px}
.slot.asap[aria-checked="true"]{background:var(--danger);color:#fff}

/* summary rail */
.rail{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(20,40,80,.04)}
.rail-head{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.rail-head h2{font-size:15px;font-weight:680}
.rail-body{padding:8px 16px 16px}
.sum{margin:0}
.sum div{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.sum dt{color:var(--ink-3);font-size:13px}
.sum dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.sum dd.empty-v{color:var(--ink-3);font-weight:500}
.sum dd.em{color:var(--danger)}
.hu-t{font-size:13px;font-weight:650;color:var(--ink-2);margin:14px 0 8px}
.missing{font-size:13.5px;color:var(--ink-2);margin:14px 0 10px}
.ready{color:var(--good-ink);font-weight:600;font-size:13.5px;margin:14px 0 10px}
.rail-foot{display:flex;flex-direction:column;gap:6px}
.rail-foot .link-btn{align-self:center}

/* booked */
.done{max-width:620px;margin:32px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px}
.done-ico{width:52px;height:52px;border-radius:50%;background:var(--good-soft);color:var(--good-ink);display:grid;place-items:center}
.done-ico svg.i{width:26px;height:26px;stroke-width:2.4}
.done h1{font-size:26px;font-weight:720;margin:14px 0 4px}
.done>p{margin:0 0 14px;color:var(--ink-2)}
.done .flag{margin-top:12px}
.done-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}

/* dialog + toast */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(440px,calc(100% - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,15,25,.45)}
dialog form{margin:0}
.dlg-h{padding:18px 18px 4px}
.dlg-h h2{font-size:18px;font-weight:700}
.dlg-h p{margin:4px 0 0;font-size:13.5px}
.dlg-b{padding:8px 12px 12px}
.radio{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:7px;cursor:pointer}
.radio:hover{background:var(--line-soft)}
.radio input{width:17px;height:17px;accent-color:var(--accent)}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}


/* capacity-aware booking */
.dur{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.dur .inp{width:auto;height:32px;padding:0 8px}
.fits{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}
.cant{list-style:none;margin:10px 0 0;padding:0;font-size:13px;color:var(--ink-2);display:grid;gap:3px}
.cant b{font-weight:650;color:var(--ink);margin-right:6px}
.slot .pips{flex-wrap:wrap;justify-content:center;max-width:70px}

/* capacity board */
.cap-legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);align-items:center}
.sw{display:inline-block;width:16px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tl-drive-sw{background:repeating-linear-gradient(90deg,var(--ink-3) 0 3px,transparent 3px 6px)}
.cap-wrap{overflow-x:auto}
.cap{min-width:820px}
.cap-hd,.cap-row{display:grid;grid-template-columns:190px minmax(380px,1fr) 64px 150px;gap:0 14px;align-items:center}
.cap-hd{padding:10px 14px 6px;font-size:12px;color:var(--ink-3);font-weight:600;background:var(--surface-2);border-bottom:1px solid var(--line)}
.ticks{position:relative;height:16px}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.cap-row{padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.cap-row:last-child{border-bottom:0}
.cap-tech{display:flex;align-items:center;gap:10px;min-width:0}
.cap-tech b{display:block;font-weight:650}
.cap-tech span span{font-size:12.5px;color:var(--ink-3)}
.cap-row.is-off .agent{background:var(--line-soft);color:var(--ink-3)}
.tl{position:relative;height:34px;border-radius:7px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line-soft)}
.tl-shift{position:absolute;top:0;bottom:0;background:var(--good-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--good) 35%,transparent)}
.tl-off{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--ink-3);background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--line-soft) 6px 12px)}
.tl-past{position:absolute;top:0;bottom:0;left:0;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--danger)}
.tl-job{position:absolute;top:4px;bottom:4px;border-radius:5px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:600;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.tl-job span{overflow:hidden;text-overflow:ellipsis}
.tl-job.plan{background:var(--surface);color:var(--accent-d);border:1.5px dashed var(--accent)}
.tl-drive{position:absolute;top:15px;height:4px;background:repeating-linear-gradient(90deg,var(--ink-3) 0 3px,transparent 3px 6px)}
.cap-open{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.cap-open.zero{color:var(--danger)}
.cap-act{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.cap-skills{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-left:38px}
.cap-skills .chip{height:28px;font-size:12.5px;padding:0 10px}
@media (max-width:1100px){.bk{grid-template-columns:1fr}.rail{position:static}}
@media (max-width:820px){.page,.bk{padding:12px 16px 24px}.fgrid{grid-template-columns:1fr}.oncall{margin-left:0;width:100%}.ring-act{margin-left:0}}
@media (prefers-reduced-motion:reduce){.ring-ico::after,.live-dot,.step.need{animation:none}}

/* ===== Inventory ===== */
.inv-bar{gap:10px}
.fld-inline{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--ink-2)}
.fld-inline .inp{width:auto;min-width:200px}
.meter{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--ink-2);margin:4px 0 8px}
.meter b{color:var(--ink);font-variant-numeric:tabular-nums}
.meter .o b{color:var(--danger)}
.meter .scanhint{margin-left:auto;color:var(--ink-3);font-size:13px}
.bar{height:6px;border-radius:4px;background:var(--line-soft);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--good);transition:width .2s}
.chips{margin-bottom:12px}
.chip small{font-weight:700;color:var(--ink-3);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] small{color:inherit}
.nm{font-weight:700;color:var(--ink);text-align:left;padding:0;background:none;border:0;cursor:pointer;white-space:normal}
.nm:hover{color:var(--accent-d);text-decoration:underline}
td .sub{font-size:12.5px;color:var(--ink-3);white-space:normal;max-width:460px}
td.wrap{white-space:normal}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.stepper button{width:32px;height:34px;font-size:18px;font-weight:700;color:var(--ink-2)}
.stepper button:hover{background:var(--line-soft);color:var(--ink)}
.stepper input{width:58px;height:34px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-weight:800;font-variant-numeric:tabular-nums;background:var(--surface);color:var(--ink)}
.stepper input:focus{outline:2px solid var(--accent);outline-offset:-2px}
tr.flash td{animation:flash 1.4s ease}
@keyframes flash{0%,40%{background:var(--accent-soft)}100%{background:transparent}}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}
.block .panel-bar{padding:12px 14px 0;margin-bottom:8px}
.block .panel-bar h2{font-size:16px;font-weight:800}
.pad{padding:12px 14px 14px}
.vgrp{border-top:1px solid var(--line)}
.vgrp-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2)}
.vgrp table td{padding:7px 14px}
tr.click{cursor:pointer}
.isschips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip:disabled{opacity:.45;cursor:default}
.exp{display:flex;align-items:center;gap:12px;padding:6px 0}
.exp .btn{min-width:190px;justify-content:center}
.btnrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.note{font-size:13px;color:var(--ink-2);background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.hist{list-style:none;margin:8px 0 0;padding:0;font-size:13.5px}
.hist li{padding:6px 0;border-bottom:1px solid var(--line-soft)}
.inp.sm{height:32px;font-size:13.5px}
.inp.num{text-align:right}
textarea.inp{height:auto;padding:8px 11px;resize:vertical}
textarea.csv{min-height:300px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre}
dialog.wide{width:min(860px,calc(100% - 32px))}
.dlg-b{max-height:65vh;overflow:auto}
.vt{font-size:13.5px}.vt td,.vt th{padding:6px 8px}
.vt .inp.sm{width:110px}
.fgrid.one{grid-template-columns:1fr}
.fld.full{grid-column:1/-1}
/* drawer */
.dscrim{position:fixed;inset:0;background:rgba(10,15,25,.35);opacity:0;pointer-events:none;transition:opacity .15s;z-index:60}
.dscrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .2s ease;z-index:61;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.dr-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dr-h h2{font-size:19px;font-weight:850}.dr-h p{margin:3px 0 0;font-size:13px}
.dr-b{flex:1;overflow:auto;padding:14px 18px 20px}
.dr-b .fld{margin-top:10px}
.dr-f{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2)}
.bcrow{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:center}
.bcprev{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
.bcprev svg{width:100%;height:64px;display:block}
@media (max-width:560px){.bcrow{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}}
/* labels */
.labgrid{display:flex;flex-wrap:wrap;gap:10px}
.lab{background:#fff;color:#000;border:1px dashed #9aa5ab;border-radius:4px;padding:.06in .08in;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
.lab-bin{width:2in;height:1in}
.lab-shelf{width:3in;height:2in}
.lab-sheet{width:2.625in;height:1in}
.lab-t{font-weight:700;font-size:8.5pt;line-height:1.15;max-height:2.3em;overflow:hidden}

.lab-bc{flex:1;display:flex;align-items:flex-end;min-height:0}

.lab-m{font-size:9pt;margin-top:2px}
.lab-top{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}

.binc{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;white-space:nowrap}
.binf{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap}
.binf.unk{color:var(--warn-ink)}
.stk{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid rgba(0,0,0,.25)}
.stk.y{background:#F6C915}.stk.g{background:#2FA35A}
.vmichk{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer}
.vmichk input{width:17px;height:17px}
.lab{position:relative}
.lab-dot{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--stk);border:1px solid rgba(0,0,0,.3)}
@media print{.lab-dot{display:none}}
.lab-m{text-align:center;font-size:7pt}
.lab-shelf .lab-m{font-size:9pt}
.lcfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 14px;margin:6px 0}
.stkrow{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.stkrow input[type=color]{width:38px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.binedit{width:96px}
.rng{font-variant-numeric:tabular-nums;font-weight:700}
.lab-where{font-size:6.5pt;font-weight:600;text-align:right;white-space:nowrap}
.lab-shelf .lab-where{font-size:10pt}
.rv-sec{margin-bottom:14px}
.rv-sec .panel-bar h2{margin:0}
.rv-n{font-size:13px}
.cmp{display:flex;gap:6px;align-items:center;white-space:nowrap}
.cmp b{font-variant-numeric:tabular-nums}
.btnrow.tight{gap:6px;flex-wrap:nowrap}
.dropz{display:block;border:2px dashed var(--line);border-radius:10px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--surface);margin:10px 0}
.dropz:hover,.dropz.over{border-color:var(--ink-2);background:var(--line-soft)}
.scanbox{height:46px;font-size:17px}
.scanbox:focus{outline:3px solid var(--accent, #2563eb);outline-offset:1px}
tr.click{cursor:pointer}
@media print{ body.printing #printArea.print-rtv{display:block} .rtvpaper{font-family:Arial,sans-serif;color:#000} .rtvpaper table{width:100%;border-collapse:collapse;font-size:10pt} .rtvpaper th,.rtvpaper td{border-bottom:1px solid #999;padding:4px;text-align:left} }

@media print{
  @page{margin:.25in}
  body.printing .app,body.printing dialog,body.printing .drawer,body.printing .toast,body.printing .dscrim{display:none!important}

}

/* ---------- Code 128 (set B) ---------- */
function c128(text, h, showText){
  let s = String(text||'').replace(/[^\x20-\x7e]/g,'?'); if (!s) s = '?';
  const vals = [104].concat([...s].map(ch => ch.charCodeAt(0) - 32));
  let sum = 104; for (let i = 1; i < vals.length; i++) sum += vals[i]*i;
  vals.push(sum % 103);
  let bits = vals.map(v => C128[v]).join('') + '1100011101011';
  const q = 10, W = bits.length + q*2, H = h || 40;
  let x = q, out = '';
  for (let i = 0; i < bits.length; ){ if (bits[i] === '1'){ let j = i; while (bits[j] === '1') j++; out += `<rect x="${x + i - 0}" y="0" width="${j-i}" height="${H}"/>`; i = j; } else i++; }
  return `<svg class="bc" viewBox="0 0 ${W} ${H + (showText?12:0)}" preserveAspectRatio="none" role="img" aria-label="Barcode ${esc(s)}"><rect width="${W}" height="${H + (showText?12:0)}" fill="#fff"/><g fill="#000">${out}</g>${showText?`<text x="${W/2}" y="${H+10}" text-anchor="middle" font-size="10" font-family="Arial,sans-serif" fill="#000">${esc(s)}</text>`:''}</svg>`;
}

function pendingCount(){ return new Set(S.chg.filter(c => !c.sent).map(c => c.it)).size; }
function issues(){
  const out = [];
  const byCode = {}, byBc = {};
  for (const i of itemsAll()){ if (!i.act) continue;
    if (i.code) (byCode[i.code.toLowerCase()] = byCode[i.code.toLowerCase()] || []).push(i);
    if (i.bc) (byBc[i.bc] = byBc[i.bc] || []).push(i);
  }
  for (const k in byCode) if (byCode[k].length > 1) byCode[k].forEach(i => out.push({it:i, ty:'dup', msg:`Code ${i.code} is used by ${byCode[k].length} items. ServiceTitan matches on code, so only one would update.`}));
  for (const k in byBc) if (byBc[k].length > 1) byBc[k].forEach(i => out.push({it:i, ty:'dupbc', msg:`Barcode ${i.bc} is on ${byBc[k].length} items, so a scan can’t tell them apart.`}));
  for (const i of itemsAll()){ if (!i.act || i.k === 'tool') continue;
    if (!i.code) out.push({it:i, ty:'nocode', msg:'No ServiceTitan code, so it can’t be pushed or matched.'});
    else if (!inST(i)) out.push({it:i, ty:'notinst', msg:`Code ${i.code} isn’t in the ServiceTitan pricebook export. It would be added as a new material.`});
    if (/\$\s?\d|last (buy|paid)|was \$|tax=/i.test(i.desc||'')) out.push({it:i, ty:'desc', msg:'Description has pricing or buying notes in it. Customers can see material descriptions on invoices.'});
    if (i.k === 'shop' && i.dec === 'stock' && !i.prim && !i.vmi) out.push({it:i, ty:'novendor', msg:'No primary vendor, so ServiceTitan cost and POs pick a vendor at random.'});
    if (costOf(i)[0] == null) out.push({it:i, ty:'nocost', msg:'No cost from any vendor.'});
    if (i.k === 'shop' && i.dec === 'decide') out.push({it:i, ty:'decide', msg:'Stock decision still open: keep it on the shelf or not?'});
    if (i.wc && i.code && i.code !== i.wc && !(i.rv && i.rv.code === 'done')) out.push({it:i, ty:'twocodes', msg:`ServiceTitan has two codes for this item: ${i.code} here and ${i.wc} on the warehouse sheet.`});
    if (i.k === 'shop' && i.dec !== 'no' && !i.bin) out.push({it:i, ty:'nobin', msg:'No bin location, so nobody can find it on the shelf.'});
  }
  return out;
}

  ft:[['90','90'],['ST90','Street 90'],['45','45'],['ST45','Street 45'],['DE90','Drop ear 90'],['TEE','Tee'],['WYE','Wye'],['CPL','Coupling'],['SCPL','Slip coupling'],['CAP','Cap'],['PLG','Plug'],['MA','Male adapter'],['FA','Female adapter'],['UN','Union'],['RED','Fit reducer'],['BSH','Hex bushing'],['NIP','Nipple'],['BV','Ball valve'],['FLG','Flange'],['PIPE','Pipe, 10 ft']],
  cat:{'ProPress':'PP','MegaPress':'MP','Black Iron':'BI','Copper Pipe':'CU','PVC and Venting':'PV','General Plumbing':'GP','Toilet Setting':'TS','Fixtures':'FX','Water Heaters':'WH','Water Treatment':'WT','Brass, Valves and Trim':'VB','Hangers and Strut':'HG','Condensate':'CD','Refrigeration':'RF','Electrical':'EL','Thermostats':'TH','HVAC Install':'HV','HVAC Repair Parts':'HR','Navien and Boiler Parts':'BLR','Duct and Sheet Metal':'DM','Shop Consumables':'CS','Shop Tools':'TL'}

const sysOf = k => S.codes.sys.find(x => x[0] === k);
const ftOf = k => S.codes.ft.find(x => x[0] === k);
function catPrefix(cat){

const codeSet = (exceptId) => new Set(itemsAll().filter(i => i.id !== exceptId).map(i => (i.code||'').toUpperCase()).filter(Boolean));
function uniq(code, used){ let c = code, n = 2; while (used.has(c.toUpperCase())) c = code + '-' + n++; used.add(c.toUpperCase()); return c; }

function parseFitting(i){

const fitSig = i => { const f = parseFitting(i); return f ? fitCode(f.sys, f.ft, f.sizes).toUpperCase() : null; };
function parseFit1(i, src){
  let t = ` ${src} `.toLowerCase().replace(/½/g,'1/2').replace(/¾/g,'3/4').replace(/''|”|″/g,'"').replace(/\b1(1\/[24])(?=\s*("|'|in\b|by|x|$| ))/g,'1-$1').replace(/\b(\d) (\d\/\d)/g,'$1-$2');

function ciDraft(){ if (!S.ciDraft) S.ciDraft = {from:'job', job:'', by:'', lines:[], unknown:[]}; return S.ciDraft; }
function ciScan(v){
  v = String(v||'').trim(); if (!v) return false; const d = ciDraft(); const i = findItem(v);
  if (!i){ if (!d.unknown.includes(v)) d.unknown.unshift(v); save(); toast(`No item with ${v}`); render(); return true; }
  const l = d.lines.find(x => x.it === i.id && x.cond === 'good'); if (l) l.q++; else d.lines.unshift({it:i.id, q:1, cond:'good', note:''});
  save(); render(); toast(`${i.name}: ${(l||d.lines[0]).q}`); return true;
}
function rCheckin(){
  const d = ciDraft(), trucks = S.locs.filter(l => l.kind !== 'W');
  const val = d.lines.reduce((s,l) => { const i = IT(l.it), c = i ? costOf(i)[0] : null; return s + (l.cond === 'good' && c ? c*l.q : 0); }, 0);
  const hist = S.cis || [];
  return `<div class="page">
  <section class="block open rv-sec"><div class="panel-bar"><h2>Check returns back in</h2><span class="muted rv-n">Material coming back from a truck or a job</span></div><div class="block-body pad">
    <div class="fgrid">
      <label class="fld">Coming back from<select class="inp" data-ci="from"><option value="job" ${d.from==='job'?'selected':''}>A job</option>${trucks.filter(l => !l.off).map(l => `<option value="${l.id}" ${d.from===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}<option value="other" ${d.from==='other'?'selected':''}>Somewhere else</option></select></label>
      <label class="fld">${d.from==='job'?'Job # or customer':'Note'}<input class="inp" data-ci="job" value="${esc(d.job)}" placeholder="${d.from==='job'?'e.g. 48213 · Reyes':''}"></label>
      <label class="fld">Returned by<input class="inp" data-ci="by" value="${esc(d.by)}" placeholder="Tech name"></label>
    </div>
    <label class="fld full" style="margin-top:12px">Scan<input class="inp scanbox" id="ciScan" autocomplete="off" placeholder="Scan a barcode or type a code, then Enter" list="itList">${itDatalist()}</label>
    ${d.unknown.length ? `<div class="flag warn">Not found: ${d.unknown.slice(0,8).map(u => `<span class="mono">${esc(u)}</span>`).join(', ')}. Add the item first or check the label. <button class="link-btn" data-ciact="clearUnknown">Dismiss</button></div>` : ''}
  </div></section>
  <section class="block open rv-sec"><div class="panel-bar"><h2>This check-in</h2><span class="muted rv-n">${d.lines.reduce((s,l) => s + l.q, 0)} pieces · ${money0(val)} back on the shelf</span><span class="sp"></span><button class="btn btn-sm" data-ciact="clear" ${d.lines.length?'':'disabled'}>Clear</button><button class="btn btn-primary btn-sm" data-ciact="post" ${d.lines.length?'':'disabled'}>Post check-in</button></div><div class="block-body">
    <table><thead><tr><th>Item</th><th>Bin</th><th class="num">Qty</th><th>What happens to it</th><th>Note</th><th></th></tr></thead><tbody>
    ${d.lines.map((l,ix) => { const i = IT(l.it) || {name:l.it}; return `<tr><td><button class="nm" data-open="${esc(l.it)}">${esc(i.name)}</button><div class="sub mono">${esc(i.code||'')}</div></td><td>${i.bin?`${binTag(i.bin)}`:'<span class="muted">—</span>'}</td>
      <td class="num"><div class="stepper"><button data-ciq="${ix}" data-d="-1" aria-label="One less">−</button><input inputmode="numeric" data-ciqv="${ix}" value="${l.q}" aria-label="Quantity"><button data-ciq="${ix}" data-d="1" aria-label="One more">+</button></div></td>
      <td><select class="inp sm" data-cicond="${ix}">${COND.map(([v,t]) => `<option value="${v}" ${l.cond===v?'selected':''}>${t}</option>`).join('')}</select></td>
      <td><input class="inp sm" data-cinote="${ix}" value="${esc(l.note)}" placeholder="${l.cond==='rtv'?'Why it goes back':l.cond==='scrap'?'What’s wrong':''}"></td><td><button class="icon-btn" data-cidel="${ix}" aria-label="Remove">✕</button></td></tr>`; }).join('') || '<tr><td colspan="6" class="muted">Scan the first item to start.</td></tr>'}
    </tbody></table></div></section>
  <section class="block open rv-sec"><div class="panel-bar"><h2>Check-in log</h2></div><div class="block-body"><table><thead><tr><th>Check-in</th><th>When</th><th>From</th><th>By</th><th class="num">Back on shelf</th><th class="num">To vendor return</th><th class="num">Scrapped</th></tr></thead><tbody>
    ${hist.slice(0,100).map(c => `<tr><td><b>${esc(c.id)}</b></td><td class="muted">${when(c.t)}</td><td>${esc(c.fromName)}${c.job?` · ${esc(c.job)}`:''}</td><td>${esc(c.by||'')}</td><td class="num">${c.good} <span class="muted">${money0(c.val)}</span></td><td class="num">${c.rtv}</td><td class="num">${c.scrap}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">No check-ins yet.</td></tr>'}
    </tbody></table></div></section></div>`;
}
function ciPost(){
  const d = ciDraft(); if (!d.lines.length) return;
  S.cis = S.cis || []; S.rtvPool = S.rtvPool || [];
  const id = 'CI-' + String((S.seq.ci = (S.seq.ci||0) + 1)).padStart(3,'0');
  const fromName = d.from === 'job' ? 'Job' : d.from === 'other' ? 'Other' : (L(d.from)||{name:d.from}).name;
  let good = 0, rtv = 0, scrap = 0, val = 0;
  for (const l of d.lines){ const i = IT(l.it); if (!i) continue; const note = `${id} · ${fromName}${d.job?' · '+d.job:''}`;
    if (d.from !== 'job' && d.from !== 'other' && L(d.from)){ const ln = (S.tpl[kindOf(d.from)]||[]).find(x => x.it === i.id); if (ln && getH(d.from, ln.id) != null){ S.oh[d.from][ln.id] = Math.max(0, getH(d.from, ln.id) - l.q); S.cnt[d.from][ln.id] = now(); } }
    if (l.cond === 'good'){ good += l.q; const c = costOf(i)[0]; if (c) val += c*l.q;
      if (i.k === 'shop'){ S.oh.W[i.id] = (getH('W', i.id) || 0) + l.q; S.cnt.W[i.id] = now(); }
      move('Check-in', i.id, d.from === 'job' || d.from === 'other' ? null : d.from, 'W', l.q, note + (l.note ? ' · ' + l.note : '')); }
    else if (l.cond === 'rtv'){ rtv += l.q; S.rtvPool.push({id:'RP-' + (S.seq.rp = (S.seq.rp||0) + 1), it:i.id, q:l.q, reason:l.note || 'Unused, returned from ' + (d.job || fromName), src:id, t:now(), vendor: buyFrom(i).replace(/ \(VMI\)$/,''), stock:false});
      move('Check-in', i.id, null, null, l.q, note + ' · held for vendor return'); }
    else { scrap += l.q; move('Scrap', i.id, null, null, -l.q, note + (l.note ? ' · ' + l.note : '')); }
  }
  S.cis.unshift({id, t:now(), from:d.from, fromName, job:d.job, by:d.by, lines:d.lines, good, rtv, scrap, val});
  S.ciDraft = null; save(); toast(`${id} posted: ${good} back on the shelf${rtv?`, ${rtv} to vendor returns`:''}`); render();
}

/* ================= Vendor returns, stock list and credit check ================= */
function rtvMigrate(){
  if (S.rtvMig) return; S.rtv = S.rtv || []; S.rtvPool = S.rtvPool || [];
  for (const r of (S.rets||[])){ const i = r.it && IT(r.it); const credited = r.status === 'Credited';
    S.rtv.push({id:r.id, vendor:r.vendor, ra:'', status: credited ? 'Matched' : 'Sent', t:r.t, sentT:r.t, lines:[{it:r.it, d: i ? i.name : r.d, code: i ? i.code : '', part:'', q:r.q, c: Math.round(r.credit/(r.q||1)), reason:r.d, stock:false}], credit: credited ? {no:'', date:'', lines:[{q:r.q, amt:r.credit}], fee:0, adj:0, extra:[], t:r.t} : null, log:[{t:r.t, m:'Carried over from the old returns list'}]}); }
  S.rtvMig = true;
}
const rtvExp = r => r.lines.reduce((s,l) => s + (l.c||0)*l.q, 0);
const rtvCred = r => !r.credit ? null : r.credit.lines.reduce((s,l) => s + (l.amt||0), 0) + (r.credit.extra||[]).reduce((s,x) => s + (x.amt||0), 0) - (r.credit.fee||0) + (r.credit.adj||0);
const rtvVar = r => r.credit ? rtvCred(r) - rtvExp(r) : null;
const RTVPILL = {Draft:'p-mute', Sent:'p-warn', 'Short credit':'p-bad', Matched:'p-ok', 'Closed short':'p-mute', 'Over-credited':'p-info'};
const rtvPill = r => `<span class="pill ${RTVPILL[r.status]||'p-mute'}">${esc(r.status)}</span>`;
function rtvLog(r, m){ r.log = r.log || []; r.log.unshift({t:now(), m, by:ME}); }
function rRet(){
  rtvMigrate(); const pool = S.rtvPool, byV = {};
  pool.forEach((p,ix) => (byV[p.vendor || 'Vendor not set'] = byV[p.vendor || 'Vendor not set'] || []).push([p,ix]));
  const open = S.rtv.filter(r => r.status === 'Sent'), short = S.rtv.filter(r => r.status === 'Short credit');
  const pv = pool.reduce((s,p) => { const i = IT(p.it); const c = i ? costOf(i)[0] : 0; return s + (c||0)*p.q; }, 0);
  return `<div class="page">
  <dl class="stats" style="margin:0 0 12px"><div class="stat"><dt>Waiting to go back</dt><dd>${pool.length} · ${money0(pv)}</dd></div><div class="stat"><dt>Sent, credit not in</dt><dd class="${open.length?'due':''}">${open.length} · ${money0(open.reduce((s,r) => s + rtvExp(r), 0))}</dd></div><div class="stat"><dt>Short credits</dt><dd class="${short.length?'due':''}">${short.length} · ${money0(-short.reduce((s,r) => s + rtvVar(r), 0))}</dd></div></dl>
  <section class="block open rv-sec"><div class="panel-bar"><h2>Waiting to go back</h2><span class="muted rv-n">From check-ins, or add stock off the shelf</span><span class="sp"></span><input class="inp sm" id="poolScan" list="itList" placeholder="Scan or type to add from the shelf" autocomplete="off">${itDatalist()}</div><div class="block-body">
    ${Object.keys(byV).length ? Object.entries(byV).map(([v, rows]) => `<div class="panel-bar" style="border-top:1px solid var(--line)"><b>${esc(v)}</b><span class="muted rv-n">${rows.length} lines</span><span class="sp"></span><button class="btn btn-sm btn-primary" data-rtvstart="${esc(v)}">Start a return to ${esc(v)}</button></div>
      <table><tbody>${rows.map(([p,ix]) => { const i = IT(p.it)||{name:p.it}; return `<tr><td><button class="nm" data-open="${esc(p.it)}">${esc(i.name)}</button><div class="sub mono">${esc(i.code||'')}</div></td><td class="num">${p.q}</td><td class="muted">${esc(p.reason)}</td><td class="muted">${esc(p.stock?'Off the shelf':p.src)}</td><td><select class="inp sm" data-poolv="${ix}" aria-label="Vendor">${[...new Set([p.vendor, ...Object.keys((IT(p.it)||{}).v||{}), ...vendorsAll()])].filter(Boolean).map(x => `<option ${x===p.vendor?'selected':''}>${esc(x)}</option>`).join('')}</select></td><td><button class="icon-btn" data-pooldel="${ix}" aria-label="Remove">✕</button></td></tr>`; }).join('')}</tbody></table>`).join('') : '<div class="empty"><p>Nothing waiting. Check-ins marked “Return to vendor” land here.</p></div>'}
  </div></section>
  <section class="block open rv-sec"><div class="panel-bar"><h2>Vendor returns</h2><span class="sp"></span><button class="btn btn-sm" data-act="rtvExport">Download the log (CSV)</button><button class="btn btn-sm" data-act="newRet">New return</button></div><div class="block-body">
    <table><thead><tr><th>Return</th><th>Vendor</th><th>RA #</th><th class="num">Lines</th><th class="num">Expected credit</th><th class="num">Credited</th><th class="num">Difference</th><th>Status</th></tr></thead><tbody>
    ${S.rtv.map(r => { const v = rtvVar(r); return `<tr class="click" data-rtvopen="${esc(r.id)}"><td><b>${esc(r.id)}</b><div class="sub muted">${when(r.t)}</div></td><td>${esc(r.vendor)}</td><td class="mono">${esc(r.ra||'')}</td><td class="num">${r.lines.length}</td><td class="num">${money(rtvExp(r))}</td><td class="num">${r.credit ? money(rtvCred(r)) : '<span class="muted">—</span>'}</td><td class="num">${v == null ? '' : v === 0 ? '<span class="pill p-ok">$0.00</span>' : `<span class="pill ${v<0?'p-bad':'p-info'}">${v<0?'−':'+'}${money(Math.abs(v))}</span>`}</td><td>${rtvPill(r)}</td></tr>`; }).join('') || '<tr><td colspan="8" class="muted">No vendor returns yet.</td></tr>'}
    </tbody></table></div></section></div>`;
}
function newRet(){ dlg(`<div class="dlg-h"><h2>New vendor return</h2></div><div class="dlg-b"><div class="fgrid"><label class="fld full">Vendor<select class="inp" id="rtvV">${vendorsAll().map(v => `<option>${esc(v)}</option>`).join('')}</select></label></div><p class="muted">You’ll scan or add the items on the next screen.</p></div><div class="dlg-f"><span class="sp"></span><button class="btn" data-act="dlgClose">Cancel</button><button class="btn btn-primary" data-rtvnew="1">Create return</button></div>`); }
function rtvCreate(vendor, poolIdx){
  rtvMigrate(); const id = 'RTV-' + String((S.seq.rtv = (S.seq.rtv||0) + 1)).padStart(3,'0');
  const r = {id, vendor, ra:'', status:'Draft', t:now(), lines:[], credit:null, log:[]};
  const take = (poolIdx||[]).map(ix => S.rtvPool[ix]).filter(Boolean);
  for (const p of take){ const i = IT(p.it); rtvAddLine(r, i, p.q, p.reason, p.stock, p.src); }
  S.rtvPool = S.rtvPool.filter(p => !take.includes(p));
  rtvLog(r, `Created${take.length?` with ${take.length} lines from the waiting list`:''}`);
  S.rtv.unshift(r); save(); render(); openRTV(id);
}
function rtvAddLine(r, i, q, reason, stock, src){
  if (!i) return; const vv = i.v[r.vendor] || {};
  const ex = r.lines.find(l => l.it === i.id && !!l.stock === !!stock && (l.reason||'') === (reason||''));
  if (ex){ ex.q += q; return; }
  r.lines.push({it:i.id, d:i.name, code:i.code||'', part:vv.p || '', q, c: vv.c ?? costOf(i)[0] ?? 0, reason: reason || '', stock: !!stock, src: src || ''});
}
function openRTV(id){
  const r = S.rtv.find(x => x.id === id); if (!r) return; const ed = r.status === 'Draft', cr = r.credit;
  const lineCred = ix => cr && cr.lines[ix] ? cr.lines[ix] : null;
  const flag = (l, ix) => { const c = lineCred(ix); if (!cr) return ''; if (!c || (!c.q && !c.amt)) return '<span class="pill p-bad">Not on the credit</span>'; const out = []; if (c.q < l.q) out.push(`<span class="pill p-bad">Short ${l.q - c.q}</span>`); const exp = (l.c||0)*Math.min(l.q, c.q); if (c.amt < exp - 1) out.push(`<span class="pill p-bad">${money(exp - c.amt)} under</span>`); if (c.amt > exp + 1 && c.q >= l.q) out.push(`<span class="pill p-info">${money(c.amt - exp)} over</span>`); return out.join(' ') || '<span class="pill p-ok">Matches</span>'; };
  const v = rtvVar(r);
  dlg(`<div class="dlg-h"><h2>${esc(r.id)} · return to ${esc(r.vendor)}</h2><p>${rtvPill(r)} Created ${when(r.t)}${r.sentT?` · sent ${when(r.sentT)}`:''}</p></div><div class="dlg-b">
    <div class="fgrid"><label class="fld">Vendor RA / return # <input class="inp mono" data-rtvf="ra" value="${esc(r.ra||'')}" placeholder="From the counter or the vendor"></label><label class="fld">Note<input class="inp" data-rtvf="note" value="${esc(r.note||'')}"></label></div>
    ${ed ? `<label class="fld full" style="margin-top:10px">Scan items going back (taken off the warehouse shelf)<input class="inp scanbox" id="rtvScan" data-rtv="${esc(r.id)}" list="itList" autocomplete="off" placeholder="Scan or type a code, then Enter">${itDatalist()}</label>` : ''}
    <table class="vt" style="margin-top:10px"><thead><tr><th>Item</th><th>Vendor part</th><th class="num">Qty</th><th class="num">Unit credit</th><th class="num">Expected</th><th>Reason</th>${cr?'<th class="num">Credited qty</th><th class="num">Credited $</th><th>Check</th>':''}${ed?'<th></th>':''}</tr></thead><tbody>
    ${r.lines.map((l,ix) => `<tr><td>${esc(l.d)}<div class="sub mono">${esc(l.code)}${l.stock?' · off the shelf':''}</div></td><td>${ed?`<input class="inp sm mono" data-rtvl="${ix}" data-k="part" value="${esc(l.part)}">`:`<span class="mono">${esc(l.part)}</span>`}</td>
      <td class="num">${ed?`<input class="inp sm num" data-rtvl="${ix}" data-k="q" value="${l.q}">`:l.q}</td><td class="num">${ed?`<input class="inp sm num" data-rtvl="${ix}" data-k="c" value="${((l.c||0)/100).toFixed(2)}">`:money(l.c)}</td><td class="num">${money((l.c||0)*l.q)}</td>
      <td>${ed?`<input class="inp sm" data-rtvl="${ix}" data-k="reason" value="${esc(l.reason)}">`:esc(l.reason)}</td>
      ${cr?`<td class="num">${lineCred(ix)?lineCred(ix).q:0}</td><td class="num">${money(lineCred(ix)?lineCred(ix).amt:0)}</td><td>${flag(l,ix)}</td>`:''}${ed?`<td><button class="icon-btn" data-rtvdel="${ix}" aria-label="Remove">✕</button></td>`:''}</tr>`).join('') || `<tr><td colspan="7" class="muted">No lines yet.</td></tr>`}
    ${cr && (cr.extra||[]).length ? cr.extra.map(x => `<tr><td colspan="5" class="muted">On the credit slip only: ${esc(x.d)}</td><td></td><td></td><td class="num">${money(x.amt)}</td><td><span class="pill p-info">Extra line</span></td></tr>`).join('') : ''}
    </tbody></table>
    <div class="cmp" style="justify-content:flex-end;gap:18px;margin-top:10px;flex-wrap:wrap"><span>Expected <b>${money(rtvExp(r))}</b></span>${cr?`<span>Restocking fee <b>${money(cr.fee||0)}</b></span><span>Credited <b>${money(rtvCred(r))}</b></span><span>Difference <b class="${v<0?'due':''}">${v<0?'−':''}${money(Math.abs(v))}</b></span>`:''}</div>
    ${cr ? `<p class="muted">Credit slip ${esc(cr.no||'(no number)')}${cr.date?` dated ${esc(cr.date)}`:''}, entered ${when(cr.t)}.</p>` : ''}
    <h3 class="subhead">History</h3><ul class="hist">${(r.log||[]).map(x => `<li>${esc(x.m)} <span class="muted">${when(x.t)}${x.by?' · '+esc(x.by):''}</span></li>`).join('')}</ul>
  </div>
  <div class="dlg-f">${ed?`<button class="btn" data-rtvact="delete" data-id="${esc(r.id)}">Delete draft</button>`:''}<button class="btn" data-rtvact="pdf" data-id="${esc(r.id)}" ${r.lines.length?'':'disabled'}>Stock list PDF</button><button class="btn" data-rtvact="print" data-id="${esc(r.id)}" ${r.lines.length?'':'disabled'}>Print stock list</button><span class="sp"></span>
    ${ed?`<button class="btn btn-primary" data-rtvact="send" data-id="${esc(r.id)}" ${r.lines.length?'':'disabled'}>Mark as sent</button>`:''}
    ${r.status==='Sent'||r.status==='Short credit'||r.status==='Over-credited'?`<button class="btn btn-primary" data-rtvact="credit" data-id="${esc(r.id)}">${cr?'Edit the credit slip':'Enter the credit slip'}</button>`:''}
    ${r.status==='Short credit'?`<button class="btn" data-rtvact="closeShort" data-id="${esc(r.id)}">Accept and close</button>`:''}
    <button class="btn" data-act="dlgClose">Close</button></div>`, true);
}
function creditDlg(id){
  const r = S.rtv.find(x => x.id === id); if (!r) return; const cr = r.credit || {no:'', date:'', lines: r.lines.map(l => ({q:l.q, amt:(l.c||0)*l.q})), fee:0, adj:0, extra:[]};
  dlg(`<div class="dlg-h"><h2>Credit slip for ${esc(r.id)}</h2><p>Type what the vendor’s credit memo actually says. Hustl checks it against what you sent.</p></div><div class="dlg-b">
    <div class="fgrid"><label class="fld">Credit memo #<input class="inp mono" id="crNo" value="${esc(cr.no)}"></label><label class="fld">Date on the slip<input class="inp" id="crDate" type="date" value="${esc(cr.date)}"></label></div>
    <div class="btnrow"><button class="btn btn-sm" data-crfull="1">Credited in full</button><button class="btn btn-sm" data-crzero="1">Clear the amounts</button></div>
    <table class="vt"><thead><tr><th>Item</th><th class="num">Sent</th><th class="num">Expected</th><th class="num">Qty on slip</th><th class="num">$ on slip</th></tr></thead><tbody>
    ${r.lines.map((l,ix) => `<tr><td>${esc(l.d)}<div class="sub mono">${esc(l.part||l.code)}</div></td><td class="num">${l.q}</td><td class="num">${money((l.c||0)*l.q)}</td><td class="num"><input class="inp sm num" data-crq="${ix}" value="${cr.lines[ix]?cr.lines[ix].q:0}"></td><td class="num"><input class="inp sm num" data-cra="${ix}" data-exp="${(l.c||0)*l.q}" data-unit="${l.c||0}" value="${((cr.lines[ix]?cr.lines[ix].amt:0)/100).toFixed(2)}"></td></tr>`).join('')}
    </tbody></table>
    <div class="fgrid" style="margin-top:10px"><label class="fld">Restocking fee ($)<input class="inp num" id="crFee" value="${((cr.fee||0)/100).toFixed(2)}"></label><label class="fld">Other adjustment (+ or −, $)<input class="inp num" id="crAdj" value="${((cr.adj||0)/100).toFixed(2)}"></label>
      <label class="fld">Line on the slip that wasn’t sent<input class="inp" id="crXd" placeholder="Description" value="${esc((cr.extra[0]||{}).d||'')}"></label><label class="fld">Its amount ($)<input class="inp num" id="crXa" value="${cr.extra[0]?((cr.extra[0].amt||0)/100).toFixed(2):''}"></label></div>
    <p class="muted" id="crSum"></p></div>
    <div class="dlg-f"><span class="sp"></span><button class="btn" data-rtvback="${esc(r.id)}">Back</button><button class="btn btn-primary" data-crsave="${esc(r.id)}">Save and check</button></div>`, true);
  crSum(r);
}

  }

function createPO(vendor){
  const L2 = [];
  for (const r of rows('W')){ if (r.it.dec !== 'stock' || r.it.vmi || getH('W', r.key) == null) continue; const n = needOf('W', r); if (n && buyFrom(r.it) === vendor) L2.push({it:r.it.id, d:r.it.name, code:r.it.code, part:(r.it.v[vendor]||{}).p||'', q:n, c:(r.it.v[vendor]||{}).c ?? costOf(r.it)[0] ?? 0, r:0}); }
  if (!L2.length) return;
  const id = 'PO-' + (S.seq.po++);
  S.pos.unshift({id, vendor, for:'Shop restock', status:'Draft', bill:false, t:now(), lines:L2});
  save(); toast(`${id} drafted with ${L2.length} lines`); openPO(id);
}
function transferTruck(locId){
  let moved = 0, missing = 0;
  for (const r of rows(locId)){ const n = needOf(locId, r); if (!n || r.it.k === 'tool') continue;
    if (r.it.k !== 'shop'){ missing++; continue; }
    const shopH = getH('W', r.it.id); if (shopH == null || shopH <= 0){ missing++; continue; }
    const stick = r.line.ft && isStick(r.it);
    let take = stick ? Math.min(Math.ceil(n/10), shopH) : Math.min(n, shopH);
    const add = stick ? take*10 : take;
    S.oh.W[r.it.id] = shopH - take; S.cnt.W[r.it.id] = now();
    S.oh[locId][r.key] = (getH(locId, r.key)||0) + add; S.cnt[locId][r.key] = now();
    move('Transfer', r.it.id, 'W', locId, add, stick ? `${take} sticks` : ''); moved++;
    if ((stick ? take*10 : take) < n) missing++;
  }
  save(); render(); toast(`Moved ${moved} items to ${L(locId).name}${missing?` · ${missing} the shop can’t cover`:''}`);
}

const CL = {ver:0, busy:false, dirty:false, at:0, by:'', timer:null, ready:false, portal:'', base:null, lastStr:''};
// three-way merge: keep my changes and theirs; logs are combined
const MJ = x => JSON.stringify(x);
const LOGKEY = {chg: c => c.it + '|' + c.f + '|' + (c.sent ? c.t : 'pending'), moves: m => m.t + '|' + m.ty + '|' + (m.it||'') + '|' + (m.note||''), toolLog: x => x.t + '|' + x.tool + '|' + x.action, pushLog: x => String(x.t)};
function merge3(base, loc, rem, path){
  const sl = MJ(loc), sr = MJ(rem), sb = MJ(base);
  if (sl === sb) return rem; if (sr === sb || sl === sr) return loc;
  if (Array.isArray(loc) && Array.isArray(rem)){
    if (LOGKEY[path]){ const key = LOGKEY[path], by = new Map(); for (const x of rem.concat(loc)){ const k = key(x), o = by.get(k); if (!o || (x.t||0) >= (o.t||0)) by.set(k, x); } return [...by.values()].sort((a,b) => (b.t||0) - (a.t||0)); }
    if (path === 'order') return [...new Set(rem.concat(loc))];
    return loc;
  }
  if (loc && rem && typeof loc === 'object' && typeof rem === 'object'){
    const b = base && typeof base === 'object' ? base : {}, out = {};
    for (const k of new Set(Object.keys(rem).concat(Object.keys(loc)))){
      const lk = k in loc, rk = k in rem, bk = k in b;
      if (!lk && bk && MJ(rem[k]) === MJ(b[k])) continue;   // I deleted it
      if (!rk && bk && MJ(loc[k]) === MJ(b[k])) continue;   // they deleted it
      out[k] = !lk ? rem[k] : !rk ? loc[k] : merge3(b[k], loc[k], rem[k], k);
    }
    return out;
  }
  return loc;
}

const gsr = (fn, ...args) => new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...args));
function sharedState(){ const c = Object.assign({}, S); c.sel = []; return c; }
function applyRemote(r){
  const nS = JSON.parse(r.state); if (!nS || nS.v !== 1) return;
  const sel = S && S.sel || []; S = nS; S.sel = sel;
  for (const L of S.locs){ S.oh[L.id] = S.oh[L.id] || {}; S.cnt[L.id] = S.cnt[L.id] || {}; }
  CL.ver = r.ver; CL.by = r.by || ''; CL.at = r.at || 0; CL.base = JSON.parse(r.state); CL.lastStr = r.state;

async function cloudSave(){
  if (CL.busy){ CL.dirty = true; return; }
  CL.busy = true; CL.dirty = false; cloudBadge('Saving…');
  try {
    let str = JSON.stringify(sharedState());
    if (str === CL.lastStr){ cloudBadge('Saved for the team', 'ok'); return; }        // nothing changed: don't write
    let r = await gsr('invSave', str, CL.ver), tries = 0;
    while (r.conflict && tries++ < 3){                                                   // someone saved first: merge, don't drop
      const x = await gsr('invLoad'); if (!x.state) break;
      const remote = JSON.parse(x.state), merged = merge3(CL.base || remote, JSON.parse(str), remote, '');
      const sel = S.sel || []; S = merged; S.sel = sel; for (const L of S.locs){ S.oh[L.id] = S.oh[L.id] || {}; S.cnt[L.id] = S.cnt[L.id] || {}; }
      CL.ver = x.ver; CL.base = remote; CL.lastStr = x.state; str = JSON.stringify(sharedState());
      toast('Merged your changes with ' + (x.by || 'a teammate') + '’s'); render();
      r = await gsr('invSave', str, CL.ver);
    }
    if (r.conflict){ cloudBadge('Not saved: retrying', 'bad'); CL.dirty = true; setTimeout(cloudQueue, 4000); return; }
    CL.ver = r.ver; CL.at = r.at; CL.by = ME; CL.base = JSON.parse(str); CL.lastStr = str; cloudBadge('Saved for the team · ' + new Date(r.at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}), 'ok');
  } catch(e){ cloudBadge('Not saved: retrying', 'bad'); CL.dirty = true; setTimeout(cloudQueue, 8000); }
  finally { CL.busy = false; if (CL.dirty) cloudQueue(); }
}

    if (!st){

      rows.push({action:'pb_create', item:i, cs, payload:{type:'Material', code:i.code, fields:{displayName:i.name, description:i.desc || i.name, cost: cost != null ? cost/100 : 0}, vendor: vid && vv ? {vendorId: vid, cost: vv.c != null ? vv.c/100 : 0, vendorPart: vv.p || undefined} : null}});
