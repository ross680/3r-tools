<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3R Tools</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--blue:#26A4CB;--blue-d:#136C88;--blue-l:#BFE6F3;--ink:#141414;--ink2:#56616A;--bg:#F3F5F6;--panel:#FFFFFF;--line:#DDE3E6;--soft:#EAF6FA;--good:#2C9A5B;--warn:#B8680F;--bad:#C8413A;
--f:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#EEF2F4;--ink2:#A6B2B8;--bg:#0E1113;--panel:#171B1E;--line:#2A3136;--soft:#13252C;--warn:#E9A04A;--bad:#E8675F;--good:#4CC07E;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#EEF2F4;--ink2:#A6B2B8;--bg:#0E1113;--panel:#171B1E;--line:#2A3136;--soft:#13252C;--warn:#E9A04A;--bad:#E8675F;--good:#4CC07E;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45}
.hdr{background:#000;color:#fff;position:relative;overflow:hidden}
.hdr::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(38,164,203,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(38,164,203,.13) 1px,transparent 1px);background-size:22px 22px;pointer-events:none}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--blue)}
.hdr-in{position:relative;display:flex;align-items:center;gap:14px;padding:14px 20px 16px;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.bmark img{height:54px;width:auto;display:block}
.bword{display:flex;flex-direction:column;gap:4px;min-width:0}.bwm img{height:28px;width:auto;max-width:48vw;display:block}
.bnm{font-stretch:118%;font-weight:700;font-size:12.5px;letter-spacing:.14em;color:var(--blue);line-height:1.1;white-space:nowrap}
.sp{flex:1}.hbtn{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:7px 12px;font:700 13px var(--f);white-space:nowrap;cursor:pointer}
.hbtn:hover{border-color:var(--blue);color:var(--blue-l)}
@media (max-width:560px){.bmark img{height:40px}.bwm img{height:17px;max-width:calc(100vw - 230px)}.bnm{display:none}}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs .in{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
nav.tabs a{padding:12px 14px 10px;font-weight:700;color:var(--ink2);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--blue)}
nav.tabs a .ct{font-weight:600;font-size:12.5px;background:var(--line);color:var(--ink);border-radius:10px;padding:1px 7px;margin-left:5px}
main{max-width:1180px;margin:0 auto;padding:18px 20px 70px}
h1{font-stretch:112%;font-weight:850;font-size:28px;line-height:1.05;margin:0 0 4px;letter-spacing:-.4px}
h2{font-stretch:110%;font-size:20px;margin:0}
.lead{margin:0 0 14px;color:var(--ink2);max-width:70ch}
.sbar{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin:6px 0 10px}
.sbar .q{flex:1 1 320px;position:relative}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.sbar .q input{width:100%;font-size:17px;padding:12px 14px;border:2px solid var(--blue)}
.sbar label{display:flex;flex-direction:column;font-size:12.5px;font-weight:700;color:var(--ink2);gap:3px}
.sbar label input,.sbar label select{min-width:0}
.sbar .wq{width:90px}
.hint{font-size:13px;color:var(--ink2);margin:0 0 14px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:700 14px var(--f);cursor:pointer;white-space:nowrap}.btn:hover{background:var(--blue-d)}
.btn.ghost{background:transparent;color:var(--blue-d);border:1.5px solid var(--blue)}:root[data-theme="dark"] .btn.ghost{color:var(--blue-l)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--blue-l)}}
.btn.sm{padding:5px 10px;font-size:13px}.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sum{display:flex;flex-wrap:wrap;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:0 0 14px;overflow:hidden}
.sum div{padding:10px 16px;border-right:1px solid var(--line);min-width:120px}.sum div:last-child{border-right:0}
.sum b{display:block;font-stretch:115%;font-size:22px;font-weight:850;line-height:1.1}.sum span{font-size:12.5px;color:var(--ink2);font-weight:600}
.pick{background:var(--soft);border:1.5px solid var(--blue);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.pick h3{margin:0 0 4px;font-size:15px}.pick p{margin:2px 0}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 4px;margin:0 0 14px}.grp .gh .d{font-weight:800;font-size:16px}.grp .gh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;margin-bottom:10px}.grp .pick{margin:0 0 8px}.grp .warnbox{margin:0 0 8px}
.warnbox{background:rgba(200,65,58,.08);border:1.5px solid rgba(200,65,58,.45);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:12px 2px;border-top:1px solid var(--line)}
.row.best{background:var(--soft);border-radius:8px;padding:12px 10px;border-top-color:transparent}
.row .d{font-weight:700;font-size:15.5px}
.row .m{font-size:13.5px;color:var(--ink2)}.row .m b{color:var(--ink);font-weight:700}
.row .act{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row .act input{width:70px;padding:6px 8px}
.rem{text-align:right;font-size:13px;color:var(--ink2);white-space:nowrap}.rem b{font-size:18px;color:var(--ink);font-stretch:112%}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;font-weight:700;border-radius:5px;padding:2px 7px;white-space:nowrap}
.t-b{background:rgba(38,164,203,.14);color:var(--blue-d)}.t-w{background:rgba(224,138,30,.15);color:var(--warn)}.t-r{background:rgba(200,65,58,.12);color:var(--bad)}.t-g{background:rgba(44,154,91,.13);color:var(--good)}.t-n{background:var(--line);color:var(--ink2)}
:root[data-theme="dark"] .t-b{color:var(--blue-l)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-b{color:var(--blue-l)}}
.note{font-size:12.5px;color:var(--warn);margin-top:3px}
a.src{color:var(--blue-d);font-weight:700;font-size:13px}:root[data-theme="dark"] a.src{color:var(--blue-l)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) a.src{color:var(--blue-l)}}
.msg{font-size:13px;font-weight:700;color:var(--bad);width:100%;text-align:right}
.vend{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 18px;overflow:hidden}
.vh{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);border-left:5px solid var(--blue)}
.vh h2{margin-right:auto}.vh label{font-size:12.5px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;gap:2px}
.vh input,.vh select{padding:6px 8px;font-size:14px}.vh .ra{width:150px}
.cat{padding:8px 16px 2px;font-weight:800;font-size:13px;color:var(--ink2);background:var(--bg);border-top:1px solid var(--line)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}td.ds{min-width:220px}
th{text-align:left;font-size:12px;color:var(--ink2);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td input.qi{width:64px;padding:5px 7px;text-align:right}
td .who{font-size:12px;color:var(--ink2)}
.st{font-size:12.5px;font-weight:700;white-space:nowrap}
.vf{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:12px 16px;background:var(--bg)}
.vf .tot{margin-right:auto;font-size:14px}.vf .tot b{font-size:18px;font-stretch:112%}
.diff-bad{color:var(--bad);font-weight:800}.diff-ok{color:var(--good);font-weight:800}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--ink2)}
.banner{background:rgba(224,138,30,.12);border:1px solid rgba(224,138,30,.4);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:14px}
.about{max-width:76ch}.about li{margin:4px 0}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;font-size:14px;z-index:20}#toast.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:640px;width:92vw}
dialog textarea{width:100%;font:12px ui-monospace,monospace}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:640px){.tw table,.tw tbody,.tw tr,.tw td{display:block}.tw thead{display:none}.tw tr{padding:10px 16px;border-bottom:1px solid var(--line)}.tw td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}.tw td.ds{display:block;text-align:left;font-weight:700;min-width:0}.tw td[data-l]::before{content:attr(data-l);color:var(--ink2);font-size:12.5px;font-weight:600;text-align:left}.tw td.ds::before,.tw td[data-l=""]::before{display:none}.tw td.cat{display:block;text-align:left;margin:0 -16px;padding:8px 16px 4px}.tw tr:has(td.cat){padding:0;border:0}.vh .ra{width:100%}.vh label{flex:1 1 140px}
.row{grid-template-columns:1fr}.row .act{justify-content:flex-start}.rem{text-align:left}.sum div{flex:1 1 45%;border-bottom:1px solid var(--line)}}
@media print{.hdr,nav.tabs,.noprint,.vh select,.btn,#toast{display:none!important}body{background:#fff;color:#000}main{padding:0}
 .vend{border:0;break-inside:auto}.vend.hide-print{display:none}.vh{border-left:0;padding:0 0 8px}td input.qi{border:0;padding:0;width:auto}.vh input{border:0;padding:0}
 tr{break-inside:avoid}.print-only{display:block!important}}
.print-only{display:none}
</style>
